    organizer_checklist:
      title: "Ruby Passport — Embassy Checklist"
      heading: "Embassy Checklist"
      subtitle: "Everything you need to run the Ruby Passport experience at your event."
      progress_label: "Progress"
      progress_template: "%{checked} of %{total} completed"
      print_checklist: "Print checklist"
      reset_all: "Reset all"
      back_to_guide: "← Back to guide"
      before_event:
        heading: "Before the event"
        description: "Complete these tasks in the days/weeks leading up to the event."
      event_morning:
        heading: "Event morning setup"
        description: "Get everything in place before doors open."
      during_event:
        heading: "During the event"
        description: "Keep the passport experience running smoothly."
      after_event:
        heading: "After the event"
        description: "Wrap up and prepare for next time."
      embassy_reference:
        heading: "Embassy worker quick reference"
        description: "Hand this section to your embassy personnel."
        role_heading: "Your role at the Embassy desk"
        role_intro: "You're the friendly face helping attendees get their Ruby Passport set up. Here's the flow:"
        step1_title: "Greet them"
        step1_detail: "— welcome them to the Ruby Embassy."
        step2_title: "Help them fill it in"
        step2_detail: "— name, date of issue, conference name on the first page."
        step3_title: "Stamp it"
        step3_detail: "— place the event stamp on the first available stamp page."
        step4_title: "Scan it"
        step4_detail: "— use the passport-scanner app on your phone to scan the passport's QR code."
        step5_title: "Photo time"
        step5_detail: "— take their headshot, print it, and help them stick it on the passport."
        printable_link: "Print the full Embassy Worker Instructions sheet →"
        scanner_heading: "Scanner app access"
        scanner_instructions_html: 'Open <span class="font-mono font-semibold">https://passport-scanner.avohq.io</span> on your phone. Your organizer will provide the login credentials. Make sure you can log in before the event starts.'
      need_help:
        heading: "Need help?"
        description: "If something isn't working or you run into any issues, email Adrian."
        email: "adrian@adrian.com"
        subject_hint: "Put \"Ruby Embassy — Urgent\" in the subject line so it gets noticed quickly."
      mc_script:
        heading: "MC announcement script"
        description: "Use this during the opening to let everyone know about the Ruby Passport."
        script_html: '"If you picked up a little burgundy booklet at registration — that''s your Ruby Passport! It''s a real passport-style booklet where you collect stamps from Ruby events around the world.<br><br>Here''s what to do: fill in your name on the first page, then head over to our Embassy desk <span class="font-semibold">[point to location]</span> to get your event stamp, have your photo taken, and scan the QR code to claim it digitally.<br><br>If you already have a passport from a previous event — bring it to the Embassy to collect this event''s stamp! These passports are brought to you by the folks at Avo, who''ve made it possible to enjoy this at Ruby events all over the world."'
      checklist:
        pre_newsletter: "Send attendees a newsletter reminder to bring their passports"
        pre_stamp: "Confirm your event stamp is ready (name, logo, date)"
        pre_passports: "Receive passports from Adrian (or confirm inventory from previous event)"
        pre_embassy_signage: 'Prepare Embassy desk signage ("The Ruby Embassy", fun messages)'
        pre_photo_gear: "Arrange photo setup (photo booth rental or camera + printer + adhesive paper)"
        pre_supplies: "Gather supplies: pens, sharpies, stickers, double-sided tape"
        pre_personnel: "Assign embassy workers / stamping personnel for the day"
        pre_scanner_app: "Set up passport-scanner app access — ensure personnel have credentials"
        pre_mc_script: "Add Ruby Passport mention to the MC/intro announcement script"
        morning_desk: "Set up the Embassy desk with signage, stamp, pens, and stickers"
        morning_photo: "Set up photo booth / camera station near the Embassy desk"
        morning_passports_reception: "Place passport stacks at the reception/registration desk (NOT on random tables)"
        morning_brief_reception: 'Brief reception staff: hand passport with badge, say "Claim yours by scanning the QR code"'
        morning_brief_embassy: "Brief embassy workers on the process: stamp, help fill in, scan, take photos"
        morning_scanner_test: "Test the passport-scanner app on embassy workers' phones"
        morning_ink: "Test stamp ink pad — make sure it's fresh"
        during_announce: "MC mentions the Ruby Passport during intro announcement"
        during_announce_location: "Announce where the Embassy desk is located"
        during_announce_what: "Announce what to do: get passport, fill it in, scan QR code, get stamp & photo"
        during_embassy_staffed: "Ensure Embassy desk is staffed throughout the event"
        during_scanning: "Embassy workers scanning passports and helping attendees claim theirs"
        during_stamping: "Stamping passports with the event stamp"
        during_photos: "Taking and printing headshot photos for attendees"
        during_help: "Helping attendees fill in their passport details"
        after_collect: "Collect leftover passports and supplies from the Embassy desk"
        after_count: "Count remaining passport inventory"
        after_contact: "Contact Adrian about leftover passports (keep for next event or return)"
