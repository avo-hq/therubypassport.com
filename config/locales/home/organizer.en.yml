en:
  home:
    organizer:
      title: "Ruby Passport — Organizer's Guide"
      hero:
        heading: "Ruby Passport"
        subheading: "Organizer's Guide"
        callout: "This is a guide for conference organizers."
        nav_tldr: "TL;DR"
        nav_faq: "FAQ"
        nav_what_to_do: "What to do"
        nav_how_to_get: "How to get Passports"
        nav_checklist: "Event Day Checklist"
        nav_embassy_instructions: "Embassy Instructions"
      intro:
        paragraph_1: "The Ruby Passport is a fun way that event organizers in our space can work together to create an ongoing experience for the Ruby community as they travel from event to event around the world."
        paragraph_2: "The idea: a realistic passport where attendees collect stamps from Ruby events they have been to."
        paragraph_3_html: "Adrian from <a href=\"https://avohq.io\" class=\"text-[#9b1c31] hover:underline font-medium\">Avo</a> in collaboration with Amanda Perino, Marco Roth, Adrien Poly and others are the ones making this possible for the community."
        paragraph_4: "As a conference organizer you can receive passports to give your guests and prepare a cool booth for them to activate them."
      tldr:
        heading: "TL;DR"
        description: "The Ruby Passport is a very memorable happening you can do at your event."
        step_1: "Make a stamp for your event"
        step_2: "Give your guests the Passport and tell them to fill it out and claim it"
        step_3: "Take their headshot photos and add them to the passport"
      faq:
        heading: "FAQ"
        q1: "Do we need to pay to get into the program?"
        a1: "No, the Ruby Passport program is completely free for event organizers."
        q2: "Do we need to prepare with something?"
        a2: "The main thing is to have an event stamp made. Everything else is optional but recommended for the best experience."
        q3: "What do I do with the left-over passports?"
        a3: "Keep them for your next event or return them to us. We'll work with you to manage inventory."
      what_to_do:
        heading: "What to do as a conference organizer?"
        description: "You can use the Ruby Passport to create a memorable experience at your event."
        stamp:
          heading: "Have an event stamp"
          paragraph_1: "This is the bare minimum that you can do — have a stamp made for your event. It can contain the name of the event and your logo/logomark. If your event is a recurring one, you can have a stamp for each year."
          paragraph_2: "This will ensure that your guests will leave with a nice, in-real-life artifact from your event."
          paragraph_3: "Also, this is the place where you can go wild. Add text, logo, logomark, make it dual-color, have a date stamp… go wild and impress."
          samples_link: "Stamp samples"
        ensure_guests:
          heading: "Ensure the guests have a passport"
          paragraph_1: "To get \"the best bang for your buck\" is to ensure your guests get a passport."
          paragraph_2: "During such events, most folks are in this \"wondering\" mode, and finding their friends and focusing on other things, so they need some help to get started with the Passport."
          hand_it_heading: "1. Hand it to them at the reception desk when you hand them the badge"
          hand_it_paragraph: "… and tell them: \"Please claim your passport by scanning the QR code or tapping it with your phone\", and \"get your stamp on at the next booth/table\" and have a separate booth or table where they can get the event stamp."
          hand_it_more_html: "More on this on the <a href=\"#embassy\" class=\"text-[#9b1c31] hover:underline font-medium\">Embassy section</a>."
          no_piles_heading: "2. Don't have piles of them laying around"
          no_piles_paragraph_1: "This has to be the anti-advice. Leaving piles of them lying around on a table for them to take it."
          no_piles_paragraph_2: "This will ensure that nobody will touch them, and nobody will know what to do with it."
        photos:
          heading: "Have a way for guests to print their photos"
          paragraph_1: "Another nifty little thing is to have a way for guests to take their photos, print, and stick them on the Passport."
          paragraph_2: "This will ensure a better stickiness and a better experience for them."
          booth_heading: "Hire a photo booth"
          booth_paragraph_1: "The simplest thing you can do is hire a photo booth which you can also brand in your event visuals. It's also the recommended way for events larger than 300 people."
          booth_paragraph_2: "The guests would have their photo taken and immediately printed for them. Most photo booths have photo paper with an adhesive back."
          booth_paragraph_3: "Plus, the photo booth will most likely be there the whole day and your guests will have so much fun using it."
          improvise_heading: "Improvise using a camera, stand, and photo printer"
          improvise_paragraph_1: "If you have a smaller budget you can improvise by using a camera on a stand or handheld, then transfer the photos to a laptop, tablet, or straight to the printer."
          improvise_paragraph_2: "It's a slower process but it will get the job done and will get those smiles going."
          improvise_paragraph_3: "PS: Don't forget to have adhesive photo paper or double sided sticky-tape for them to stick it to the Passport."
        embassy:
          heading: "Have a mock \"Embassy\" desk"
          paragraph_1: "If you want to impress the crowd, create a special Embassy desk where they can fill in mock forms and have mock government workers \"give them a hard time\" while they try to get their Passport stamped."
          paragraph_2: "The desk should have signage like \"The Ruby Embassy\" and \"Get your paperwork in order before the next event\" or other funny messages."
          paragraph_3: "There, you should have the stamp, photo gear, and plenty of pens and sharpies."
          paragraph_4: "Each passport has a blank \"Date and conference of issue\" field. This is where you can leave your mark and on the next page, be the first to place the stamp on their unofficial Ruby document."
        mention_comms:
          heading: "Mention the Passport in your previous communications"
          paragraph_1: "As time goes by, more and more folks will have passports, and it's important not to leave them at home, so make sure you write in your updates (email newsletters, tweets, and other social posts) to bring theirs."
          paragraph_2: "A simple \"Oh, chuck your passport in the backpack now so you can collect the stamp at our event\" is sufficient."
        stamping_booth:
          heading: "The stamping booth"
          paragraph_1_html: "As previously mentioned in the <a href=\"#embassy\" class=\"text-[#9b1c31] hover:underline font-medium\">Embassy section</a> this is where you help the guests fill in their passports, add your stamp, and send out good vibes."
          checklist_intro: "Don't forget to have:"
          checklist_pens: "Pens & sharpies"
          checklist_stamp: "Event stamp"
          checklist_stickers: "Stickers"
        mention_stage:
          heading: "Mention the Passport on stage"
          paragraph_1: "Another great way to make sure they are properly used is to mention them on stage in the opening when everyone is around."
          things_to_know: "The things they need to know are:"
          point_1: "each person gets a passport"
          point_2: "they can get their photo taken and added"
          point_3: "they can claim it online by scanning the QR code or tapping with their phones"
          adrian_note: "If Adrian is at the event, he can do that on stage for two minutes."
      how_to_get:
        heading: "How to get Passports for your event"
        description: "We'll work on making this process more straightforward, but for now send an email to Adrian:"
